plugins { id 'com.android.application' }

android {
    namespace 'com.yamone.arcade2'
    compileSdk 36
    defaultConfig {
        applicationId 'com.yamone.arcade2'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '0.14.0'
        testInstrumentationRunner 'com.yamone.arcade2.UiSmokeInstrumentation'
        manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            // Public test key: stable APK updates across disposable CI runners.
            storeFile rootProject.file('ci/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { buildConfigField 'boolean', 'TEST_BANNER_ENABLED', 'true' }
        release {
            // Production ads stay disabled until the owner supplies production configuration.
            buildConfigField 'boolean', 'TEST_BANNER_ENABLED', 'false'
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
dependencies { implementation 'com.google.android.gms:play-services-ads:25.5.0' }
